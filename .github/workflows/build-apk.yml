/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el)return;
  var a=el.dataset.act,v=el.dataset.v,id=el.dataset.id,d=S.sheet;
  switch(a){
    case 'tab':S.tab=v;window.scrollTo(0,0);render();break;
    case 'new-tx':newTx();break;
    case 'new-acc':newAcc();break;
    case 'edit-tx':editTx(id);break;
    case 'edit-acc':editAcc(id);break;
    case 'open-acc':S.f.acc=id;S.f.all=true;S.f.type='all';S.f.q='';S.tab='tx';window.scrollTo(0,0);render();break;
    case 'quick-acc':quickAcc(v);break;
    case 'f-acc':S.f.acc=v;render();break;
    case 'f-type':S.f.type=v;render();break;
    case 'f-all':S.f.all=!S.f.all;render();break;
    case 'f-prev':shift(S.f,-1);render();break;
    case 'f-next':shift(S.f,1);render();break;
    case 'r-acc':S.r.acc=v;render();break;
    case 'r-prev':shift(S.r,-1);render();break;
    case 'r-next':shift(S.r,1);render();break;
    case 'fab':if(S.tab==='debts')newDebt();else newTx();break;
    case 'new-debt':newDebt();break;
    case 'open-debt':openDebt(id);break;
    case 'edit-debt':if(d)editDebt(d.id);break;
    case 'new-pay':if(d)newPay(d.id);break;
    case 'edit-pay':editPay(id);break;
    case 'toggle-due':if(d){d.hasDue=!d.hasDue;if(d.hasDue){var nm=TODAY.m+1,ny=TODAY.y;if(nm>12){nm=1;ny++}d.djy=ny;d.djm=nm;d.djd=Math.min(TODAY.d,maxDay(nm))}renderSheet()}break;
    case 'pay-all':if(d){var rm=0;debtCalc().forEach(function(q){if(q.d.id===d.debt)rm=q.rem});d.amount=rm;renderSheet()}break;
    case 'save-debt':saveDebt();break;
    case 'save-pay':savePay();break;
    case 'del-debt':delDebt();break;
    case 'del-pay':delPay();break;
    case 'close':closeSheet();break;
    case 'set-type':if(d){d.type=v;d.cat=v==='income'?'sale':'food';d.err='';if(v==='transfer'&&d.to===d.acc)d.to='';renderSheet()}break;
    case 'pick-acc':if(d){d.acc=id||v;if(d.to===d.acc)d.to='';renderSheet()}break;
    case 'pick-to':if(d){d.to=v;renderSheet()}break;
    case 'pick-color':if(d){d.color=Number(v);renderSheet()}break;
    case 'open-bak':openSheet({kind:'bak',text:'',msg:'',err:'',confirm:false});break;
    case 'bak-dl':bakDl();break;
    case 'bak-copy':bakCopy();break;
    case 'bak-restore':bakRestore();break;
    case 'cancel-bak':if(d){d.confirm=false;renderSheet()}break;
    case 'save-tx':saveTx();break;
    case 'save-acc':saveAcc();break;
    case 'ask-del':if(d){d.del=true;renderSheet()}break;
    case 'cancel-del':if(d){d.del=false;renderSheet()}break;
    case 'del-tx':delTx();break;
    case 'del-acc':delAcc();break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target,d=S.sheet;
  if(t.id==='q'){S.f.q=t.value;var l=$('#txlist');if(l)l.innerHTML=txListHTML();return}
  if(!d)return;
  if(t.id==='b-text'){d.text=t.value;d.confirm=false;return}
  if(t.id==='f-amount'||t.id==='a-init'||t.id==='g-amount'||t.id==='p-amount'){
    var dg=toEn(t.value).replace(/\D/g,'').replace(/^0+(?=\d)/,'');
    var n=dg?Math.min(Number(dg),1e13):0;
    t.value=dg?fmt(n):'';
    if(t.id==='a-init')d.init=n; else d.amount=n;
  }else if(t.id==='f-note'||t.id==='g-note'||t.id==='p-note')d.note=t.value;
  else if(t.id==='a-name'||t.id==='g-name')d.name=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target,d=S.sheet; if(!d)return;
  var gm=/^([gup])-([dmy])$/.exec(t.id);
  if(gm){
    var ks=gm[1]==='u'?['djy','djm','djd']:['jy','jm','jd'];
    if(gm[2]==='y')d[ks[0]]=Number(t.value);
    else if(gm[2]==='d')d[ks[2]]=Number(t.value);
    else{d[ks[1]]=Number(t.value);if(d[ks[2]]>maxDay(d[ks[1]]))d[ks[2]]=maxDay(d[ks[1]]);var ds=$('#'+gm[1]+'-d');if(ds)ds.innerHTML=dayOptions(d[ks[1]],d[ks[2]])}
    return;
  }
  if(t.id==='b-file'){readBak(t);return}
  if(t.id==='f-cat')d.cat=t.value;
  else if(t.id==='f-d')d.jd=Number(t.value);
  else if(t.id==='f-y')d.jy=Number(t.value);
  else if(t.id==='f-m'){d.jm=Number(t.value);if(d.jd>maxDay(d.jm))d.jd=maxDay(d.jm);var s=$('#f-d');if(s)s.innerHTML=dayOptions(d.jm,d.jd)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet)closeSheet()});

/* ---------- local storage db (this phone only) ---------- */
function localDb(){
  var KEY='daftar-kharj-v1',data={accounts:{},tx:{},debts:{},pays:{}},subs={accounts:[],tx:[],debts:[],pays:[]},memOnly=false;
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.accounts&&p.tx)data={accounts:p.accounts,tx:p.tx,debts:p.debts||{},pays:p.pays||{}}}}catch(e){memOnly=true}
  var persist=function(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){if(!memOnly){memOnly=true;S.err='ذخیره‌سازی در این برنامه کار نمی‌کند؛ اطلاعات با بستن برنامه از بین می‌رود.';render()}return false}};
  var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
  var clone=function(o){return JSON.parse(JSON.stringify(o))};
  var snap=function(c){return {docs:Object.keys(data[c]).map(function(id){return {id:id,data:function(){return data[c][id]}}}),metadata:{fromCache:false}}};
  var emit=function(c){subs[c].forEach(function(f){f(snap(c))})};
  var doc=function(c,id){return {
    set:function(o){data[c][id]=clone(o);persist();emit(c);return Promise.resolve()},
    update:function(o){if(!data[c][id])return Promise.reject(new Error('missing'));var n=clone(data[c][id]);Object.keys(o).forEach(function(k){n[k]=o[k]});data[c][id]=clone(n);persist();emit(c);return Promise.resolve()},
    delete:function(){delete data[c][id];persist();emit(c);return Promise.resolve()}
  }};
  return {
    collection:function(c){return {
      onSnapshot:function(next){subs[c].push(next);setTimeout(function(){next(snap(c))},0);return function(){subs[c]=subs[c].filter(function(f){return f!==next})}},
      add:function(o){var id=uid();data[c][id]=clone(o);persist();emit(c);var ref=doc(c,id);ref.id=id;return Promise.resolve(ref)}
    }},
    doc:function(path){var p=path.split('/');return doc(p[0],p[1])},
    _export:function(){return JSON.stringify({app:'daftar-kharj',v:1,accounts:data.accounts,tx:data.tx,debts:data.debts,pays:data.pays})},
    _import:function(o){
      var a={},t={},b={},y={};
      Object.keys(o.accounts||{}).forEach(function(id){var x=o.accounts[id];if(x&&typeof x.name==='string')a[id]=x});
      Object.keys(o.tx||{}).forEach(function(id){var x=o.tx[id];if(x&&x.amount>0&&x.dk&&x.acc)t[id]=x});
      Object.keys(o.debts||{}).forEach(function(id){var x=o.debts[id];if(x&&x.amount>0&&x.name)b[id]=x});
      Object.keys(o.pays||{}).forEach(function(id){var x=o.pays[id];if(x&&x.amount>0&&x.debt)y[id]=x});
      data={accounts:a,tx:t,debts:b,pays:y};persist();emit('accounts');emit('tx');emit('debts');emit('pays');
    }
  };
}

/* ---------- backup ---------- */
async function bakDl(){
  var txt=S.db._export(),fname='daftar-kharj-backup-'+TODAY.k+'.json';
  var P=window.Capacitor&&window.Capacitor.Plugins;
  if(P&&P.Filesystem&&P.Share){
    try{
      var r=await P.Filesystem.writeFile({path:fname,data:txt,directory:'CACHE',encoding:'utf8'});
      await P.Share.share({title:fname,url:r.uri,dialogTitle:'ذخیرهٔ فایل پشتیبان'});
      toast('فایل پشتیبان ساخته شد');return;
    }catch(e){if(/cancel/i.test(String((e&&e.message)||e)))return}
  }
  try{
    var b=new Blob([txt],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=fname;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    toast('فایل پشتیبان ساخته شد');
  }catch(e){toast('دانلود ممکن نشد؛ از «کپی متن پشتیبان» استفاده کنید')}
}
async function bakCopy(){
  var d=S.sheet;if(!d)return;
  var txt=S.db._export();d.text=txt;d.err='';d.confirm=false;
  d.msg='متن پشتیبان در کادر پایین آمد. آن را در جای امنی نگه دارید.';
  try{await navigator.clipboard.writeText(txt);d.msg='متن پشتیبان کپی شد و در کادر پایین هم آمده است.'}catch(e){}
  renderSheet();var ta=$('#b-text');if(ta){ta.focus();ta.select()}
}
function readBak(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var d=S.sheet;if(!d)return;d.text=String(r.result||'');d.msg='فایل خوانده شد. برای بازیابی، دکمهٔ پایین را بزنید.';d.err='';d.confirm=false;renderSheet()};
  r.onerror=function(){var d=S.sheet;if(d){d.err='فایل خوانده نشد.';renderSheet()}};
  r.readAsText(f);
}
function bakRestore(){
  var d=S.sheet;if(!d)return;
  var o;
  try{o=JSON.parse(d.text)}catch(e){d.err='متن پشتیبان معتبر نیست.';d.confirm=false;renderSheet();return}
  if(!o||typeof o.accounts!=='object'||typeof o.tx!=='object'){d.err='این متن، پشتیبان دفتر خرج نیست.';d.confirm=false;renderSheet();return}
  if(!d.confirm){d.confirm=true;d.err='';renderSheet();return}
  try{S.db._import(o);closeSheet();toast('بازیابی شد')}catch(e){d.err='بازیابی نشد.';d.confirm=false;renderSheet()}
}

/* ---------- data ---------- */
async function start(){
  render();
  var db=null;
  try{ db=localDb(); }catch(e){}
  if(!db){S.ready=true;S.err='ذخیره‌سازی در این برنامه در دسترس نیست.';render();return}
  S.db=db;
  var timer=setTimeout(function(){S.slow=true;render()},10000);
  var fail=function(){S.err='دسترسی به اطلاعات قطع شد. صفحه را دوباره باز کنید.';render()};
  var names=['accounts','tx','debts','pays'],got={},conf={};
  function sub(name,apply){
    db.collection(name).onSnapshot(function(snap){
      apply(snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o}));
      got[name]=true;if(!snap.metadata.fromCache)conf[name]=true;
      S.conf=names.every(function(n){return conf[n]});if(S.conf)clearTimeout(timer);
      recompute();S.ready=names.every(function(n){return got[n]});render();
    },fail);
  }
  sub('accounts',function(a){S.accounts=a.sort(function(x,y){return (x.ts||0)-(y.ts||0)})});
  sub('tx',function(a){S.tx=a.filter(function(t){return t.amount>0&&t.dk})});
  sub('debts',function(a){S.debts=a.filter(function(q){return q.amount>0&&q.name})});
  sub('pays',function(a){S.pays=a.filter(function(q){return q.amount>0&&q.debt})});
}
start();
})();
</script>
