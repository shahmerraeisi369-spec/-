      (d.id?'':'<div class="chips">'+chip('pay-all','x','کل باقی‌مانده',false)+'</div>')+
      '<div class="fld"><span class="lbl">تاریخ</span>'+dateRow('p',d.jy,d.jm,d.jd,1)+'</div>'+
