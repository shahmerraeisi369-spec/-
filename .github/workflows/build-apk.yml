        '<label class="fld"><span>دسته</span><select id="f-cat" class="inp">'+cats.map(function(c){return '<option value="'+c[0]+'"'+(c[0]===d.cat?' selected':'')+'>'+c[1]+'</option>'}).join('')+'</select></label>')+
      '<div class="fld"><span class="lbl">تاریخ</span><div class="row3"><select id="f-d" class="inp" aria-label="روز">'+dayOptions(d.jm,d.jd)+'</select><select id="f-m" class="inp" aria-label="ماه">'+ms+'</select><select id="f-y" class="inp" aria-label="سال">'+ys+'</select></div></div>'+
      '<label class="fld"><span>یادداشت (کجا خرج کردی؟)</span><textarea id="f-note" class="inp" maxlength="300" placeholder="مثلاً: خرید از میوه‌فروشی سر کوچه">'+esc(d.note)+'</textarea></label>'+
      (d.err?'<div class="err">'+esc(d.err)+'</div>':'')+'</div>'+
