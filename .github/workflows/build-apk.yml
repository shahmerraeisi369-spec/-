<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D6B67">
<title>دفتر خرج</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone ledger. Header with today's date, scrolling view, docked 5-slot nav whose centre slot adds an entry, bottom sheets for every form. */
:root{
  --bg:#F1F5F5; --surface:#FFFFFF; --surface2:#E7EEEE; --fg:#12262B; --muted:#587076; --line:#D6E0E1;
  --accent:#0D6B67; --accent-fg:#FFFFFF; --expense:#B63A2C; --income:#157548; --transfer:#3C5CA5;
  --a0:#0D6B67; --a1:#C27712; --a2:#7A4DC2; --a3:#C23A6C; --a4:#2D6CCE; --a5:#5B7A25;
  --font:"Vazirmatn",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1618; --surface:#152225; --surface2:#1D2F34; --fg:#E5F0F0; --muted:#8CA4A9; --line:#27393E;
    --accent:#4DBFB8; --accent-fg:#052321; --expense:#F18B7D; --income:#5ECB95; --transfer:#8DA9E8;
    --a0:#4DBFB8; --a1:#E8A94A; --a2:#B496EC; --a3:#EE7FA6; --a4:#7AA6F0; --a5:#9CC25A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1618; --surface:#152225; --surface2:#1D2F34; --fg:#E5F0F0; --muted:#8CA4A9; --line:#27393E;
  --accent:#4DBFB8; --accent-fg:#052321; --expense:#F18B7D; --income:#5ECB95; --transfer:#8DA9E8;
  --a0:#4DBFB8; --a1:#E8A94A; --a2:#B496EC; --a3:#EE7FA6; --a4:#7AA6F0; --a5:#9CC25A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.app{max-width:640px;margin:0 auto;padding-block:14px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{text-align:center;font-size:17px;font-weight:800;color:var(--accent);padding:4px 0 10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{margin:0;font-size:24px;font-weight:800;line-height:1.2}
.top p{margin:2px 0 0;font-size:13px}
.sync{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--income)}
.note{border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;background:var(--surface2)}
.note.warn{color:var(--expense)}
.stack{display:grid;gap:14px;min-width:0}
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 0 0;font-size:14px;font-weight:700;color:var(--muted)}
.link{color:var(--accent);font-size:13px;font-weight:600;min-height:32px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.grid-acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acc{display:grid;gap:4px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.acc-top{display:flex;align-items:center;gap:8px;min-width:0}
.acc-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal{display:block;direction:ltr;unicode-bidi:isolate;text-align:end;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.bal.neg,.neg{color:var(--expense)}
.acc-sub{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.day{font-size:12.5px;font-weight:700;color:var(--muted);margin:6px 2px 0}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tx{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;text-align:start;width:100%;min-height:56px}
.tx+.tx{border-top:1px solid var(--line)}
.tx-main{min-width:0;display:grid;gap:1px}
.tx-title{font-weight:600;font-size:14.5px}
.tx-sub{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.tx-sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.amt{direction:ltr;unicode-bidi:isolate;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left}
.amt.expense{color:var(--expense)}.amt.income{color:var(--income)}.amt.transfer{color:var(--transfer)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;font-size:13px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.inp{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:16px}
.inp.big{font-size:26px;font-weight:700;min-height:58px;font-variant-numeric:tabular-nums}
textarea.inp{min-height:76px;resize:vertical}
.fld{display:grid;gap:6px}
.fld>span,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.row3{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:8px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.monthnav .mn{width:44px;height:44px;border-radius:10px;font-size:22px;color:var(--accent)}
.monthnav b{font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.tile small{display:block;color:var(--muted);font-size:12.5px}
.tile .amt{font-size:19px;display:block;text-align:end}
.bar{display:grid;gap:5px;padding:9px 0}
.bar+.bar{border-top:1px solid var(--line)}
.bar-h{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.bar-h .amt{font-size:13.5px}
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--expense)}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--expense);border-color:var(--expense)}
.btn.dangerfill{background:var(--expense);border-color:var(--expense);color:var(--bg)}
.btn[disabled]{opacity:.55}
.btn.block{width:100%}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-inline:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px))}
.nb{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--muted);min-height:56px}
.nb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{color:var(--accent);font-weight:700}
.nb.add{padding:0 0 8px}
.nb.add span.c{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-fg);margin-top:-18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.nb.add svg{width:28px;height:28px;stroke-width:2.2}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:93dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;z-index:41;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.sh-head h2{margin:0;font-size:17px}
.x{width:40px;height:40px;border-radius:50%;background:var(--surface2);font-size:22px;line-height:1}
.sh-body{overflow:auto;display:grid;gap:14px;align-content:start;padding:8px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.sh-foot{display:grid;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:14px}
.seg button{min-height:42px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.err{color:var(--expense);font-size:13px;font-weight:600}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.acc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:start;padding:13px 14px;min-height:62px}
.acc-row+.acc-row{border-top:1px solid var(--line)}
.acc-row .l{display:flex;align-items:center;gap:10px;min-width:0}
.acc-row .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:grid;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:90vw}
.track,.fill{display:block}
.fill.ok{background:var(--income)}
.debt{display:grid;gap:7px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}
.debt-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.debt-name{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.debt-top .amt{font-size:17px}
.debt-sub{font-size:12.5px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;color:var(--income);background:var(--surface2);padding:2px 10px;border-radius:999px}
.fab{position:fixed;z-index:19;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="brand">امور مالی رئیسی</div>
  <header class="top">
    <div><h1>دفتر خرج</h1><p id="today" class="muted"></p></div>
    <span id="sync" class="sync">در حال اتصال…</span>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="بخش‌ها">
  <div class="nav-in">
    <button class="nb" data-act="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>خانه</button>
    <button class="nb" data-act="tab" data-v="tx"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>تراکنش‌ها</button>
    <button class="nb" data-act="tab" data-v="debts"><svg viewBox="0 0 24 24"><path d="M12 3v18M17 7H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H6"/></svg>بدهی‌ها</button>
    <button class="nb" data-act="tab" data-v="rep"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20V9"/></svg>گزارش</button>
    <button class="nb" data-act="tab" data-v="acc"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1"/></svg>حساب‌ها</button>
  </div>
</nav>
<button class="fab" id="fab" data-act="fab" aria-label="ثبت جدید"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
var H=document.documentElement; H.lang='fa'; H.dir='rtl';
var $=function(s){return document.querySelector(s)};
var MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var EXP=[['food','خوراک و خواربار'],['eat','رستوران و بیرون‌بر'],['move','رفت‌وآمد و سوخت'],['bills','قبوض و شارژ'],['rent','اجاره و ودیعه'],['wear','پوشاک'],['health','درمان و دارو'],['edu','آموزش'],['fun','تفریح و سفر'],['gift','هدیه و مهمانی'],['goods','خرید کالا برای مغازه'],['pay','حقوق و دستمزد'],['fix','تعمیر و نگهداری'],['loan','قسط و وام'],['tax','مالیات و عوارض'],['save','پس‌انداز'],['other','متفرقه']];
var INC=[['sale','فروش'],['salary','حقوق'],['share','سود و سهم شریک'],['gift_in','هدیه'],['refund','برگشت پول'],['other_in','سایر درآمدها']];
var CAT={}; EXP.concat(INC).forEach(function(c){CAT[c[0]]=c[1]});
var TYPES={expense:'خرج',income:'درآمد',transfer:'انتقال'};

var nf=new Intl.NumberFormat('fa-IR');
var fmt=function(n){return nf.format(Math.round(n||0))};
var money=function(n){return (n<0?'−':'')+fmt(Math.abs(n))};
var pd=function(s){return String(s).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})};
var toEn=function(s){return String(s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var norm=function(s){return toEn(String(s||'')).replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase()};

function g2j(gy,gm,gd){
  var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979; gy-=(gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053); days%=12053;
  jy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365); days=(days-1)%365;}
  var jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
var dk=function(y,m,d){return y*10000+m*100+d};
var TODAY,YEST;
function calcToday(){
  var d=new Date(), j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
  TODAY={y:j[0],m:j[1],d:j[2],k:dk(j[0],j[1],j[2])};
  var e=new Date(Date.now()-864e5), k=g2j(e.getFullYear(),e.getMonth()+1,e.getDate());
  YEST=dk(k[0],k[1],k[2]);
}
calcToday();
function dayLabel(k){
  if(k===TODAY.k)return 'امروز'; if(k===YEST)return 'دیروز';
  var y=Math.floor(k/10000),m=Math.floor(k/100)%100,d=k%100;
  return pd(d)+' '+MONTHS[m-1]+(y!==TODAY.y?' '+pd(y):'');
}
var monthLabel=function(y,m){return MONTHS[m-1]+' '+pd(y)};
var maxDay=function(m){return m<=6?31:30};
function shift(o,delta){var m=o.jm+delta,y=o.jy; if(m>12){m=1;y++} if(m<1){m=12;y--} o.jm=m;o.jy=y}

var S={tab:'home',accounts:[],tx:[],debts:[],pays:[],accMap:{},ready:false,db:null,err:'',conf:false,cA:false,cT:false,slow:false,
  f:{acc:'all',type:'all',q:'',all:false,jy:TODAY.y,jm:TODAY.m},
  r:{acc:'all',jy:TODAY.y,jm:TODAY.m},sheet:null};

function recompute(){
  S.accMap={}; S.accounts.forEach(function(a){S.accMap[a.id]=a});
  S.tx.sort(function(a,b){return (b.dk-a.dk)||((b.ts||0)-(a.ts||0))});
}
function balances(){
  var b={}; S.accounts.forEach(function(a){b[a.id]=a.init||0});
  S.tx.forEach(function(t){
    if(t.type==='expense'){if(t.acc in b)b[t.acc]-=t.amount}
    else if(t.type==='income'){if(t.acc in b)b[t.acc]+=t.amount}
    else if(t.type==='transfer'){if(t.acc in b)b[t.acc]-=t.amount; if(t.to in b)b[t.to]+=t.amount}
  });
  return b;
}
var accName=function(id){var a=S.accMap[id];return a?a.name:'حساب حذف‌شده'};
var accColor=function(id){var a=S.accMap[id];return 'var(--a'+(a?(a.color||0)%6:0)+')'};
var lastAcc=function(){try{return localStorage.getItem('lastAcc')}catch(e){return null}};
var saveLast=function(id){try{localStorage.setItem('lastAcc',id)}catch(e){}};

function chip(act,val,label,on,color){
  return '<button class="chip" data-act="'+act+'" data-v="'+esc(val)+'" aria-pressed="'+(on?'true':'false')+'">'+(color!=null?'<i class="dot" style="background:var(--a'+(color%6)+')"></i>':'')+label+'</button>';
}
function monthNav(o,pa,na,extra){
  return '<div class="monthnav"><button class="mn" data-act="'+pa+'" aria-label="ماه قبل">›</button><b>'+(extra||monthLabel(o.jy,o.jm))+'</b><button class="mn" data-act="'+na+'" aria-label="ماه بعد">‹</button></div>';
}

/* ---------- rows ---------- */
function txRow(t){
  var title,sub;
  if(t.type==='transfer'){
    title='انتقال';
    sub='<span>از '+esc(accName(t.acc))+' به '+esc(accName(t.to))+(t.note?' · '+esc(t.note):'')+'</span>';
  }else{
    title=esc(CAT[t.cat]||'متفرقه');
    sub='<i class="dot" style="background:'+accColor(t.acc)+'"></i><span>'+esc(accName(t.acc))+(t.note?' · '+esc(t.note):'')+'</span>';
  }
  var sign=t.type==='expense'?'−':(t.type==='income'?'+':'');
  return '<button class="tx" data-act="edit-tx" data-id="'+esc(t.id)+'"><span class="tx-main"><span class="tx-title">'+title+'</span><span class="tx-sub">'+sub+'</span></span><span class="amt '+t.type+'">'+sign+fmt(t.amount)+'</span></button>';
}
function grouped(list){
  var out='',cur=null;
  list.forEach(function(t){
    if(t.dk!==cur){ if(cur!==null)out+='</div>'; out+='<div class="day">'+dayLabel(t.dk)+'</div><div class="list">'; cur=t.dk }
    out+=txRow(t);
  });
  return out+(cur!==null?'</div>':'');
}

/* ---------- views ---------- */
function emptyAccounts(){
  return '<div class="card quick"><b>اول حساب‌هایتان را بسازید</b><span class="muted" style="font-size:13.5px">برای هر پول یک حساب جدا بسازید تا چیزی با هم قاطی نشود. یکی از پیشنهادها را بزنید یا حساب دلخواه بسازید.</span>'+
    '<div class="chips">'+chip('quick-acc','خانواده','خانواده',false,0)+chip('quick-acc','مغازه (با شریک)','مغازه (با شریک)',false,1)+chip('quick-acc','شخصی','شخصی',false,2)+'</div>'+
    '<button class="btn primary" data-act="new-acc">ساخت حساب دلخواه</button></div>';
}
function viewHome(){
  if(!S.accounts.length)return emptyAccounts();
  var bal=balances(), spent={};
  S.tx.forEach(function(t){if(t.type==='expense'&&t.dk===TODAY.k)spent[t.acc]=(spent[t.acc]||0)+t.amount});
  var cards=S.accounts.map(function(a){
    var b=bal[a.id]||0;
    return '<button class="acc" data-act="open-acc" data-id="'+esc(a.id)+'"><span class="acc-top"><i class="dot" style="background:var(--a'+((a.color||0)%6)+')"></i><span class="acc-name">'+esc(a.name)+'</span></span><span class="bal'+(b<0?' neg':'')+'">'+money(b)+'</span><span class="acc-sub">تومان · امروز خرج '+fmt(spent[a.id]||0)+'</span></button>';
  }).join('');
  var recent=S.tx.slice(0,8);
  return '<div class="stack"><div class="sec"><span>موجودی حساب‌ها</span></div><div class="grid-acc">'+cards+'</div>'+debtLink()+
    '<div class="sec"><span>آخرین ثبت‌ها</span>'+(S.tx.length?'<button class="link" data-act="tab" data-v="tx">همه</button>':'')+'</div>'+
    (recent.length?grouped(recent):'<div class="empty">هنوز چیزی ثبت نشده. با دکمهٔ + اولین خرج را اضافه کنید.</div>')+'</div>';
}
function filtered(){
  var f=S.f,q=norm(f.q),mk=f.jy*100+f.jm;
  return S.tx.filter(function(t){
    if(f.acc!=='all'&&t.acc!==f.acc&&t.to!==f.acc)return false;
    if(f.type!=='all'&&t.type!==f.type)return false;
    if(!f.all&&Math.floor(t.dk/100)!==mk)return false;
    if(q){var hay=norm((t.note||'')+' '+(t.type==='transfer'?'انتقال':(CAT[t.cat]||''))+' '+accName(t.acc)+' '+(t.to?accName(t.to):''));if(hay.indexOf(q)<0)return false}
    return true;
  });
}
function txListHTML(){
  var list=filtered(),e=0,i=0;
  list.forEach(function(t){
    if(t.type==='transfer')return;
    if(S.f.acc!=='all'&&t.acc!==S.f.acc)return;
    if(t.type==='expense')e+=t.amount; else i+=t.amount;
  });
  var sum='<div class="sum"><span>خرج: <b class="neg">'+fmt(e)+'</b></span><span>درآمد: <b style="color:var(--income)">'+fmt(i)+'</b></span><span>(تومان)</span></div>';
  return sum+(list.length?grouped(list):'<div class="empty">موردی پیدا نشد.</div>');
}
function viewTx(){
  var f=S.f;
  var types=[['all','همه'],['expense','خرج'],['income','درآمد'],['transfer','انتقال']];
  return '<div class="stack"><input id="q" class="inp" type="search" placeholder="جستجو در یادداشت، دسته یا حساب" value="'+esc(f.q)+'" autocomplete="off">'+
    '<div class="chips scroll">'+chip('f-acc','all','همه حساب‌ها',f.acc==='all')+S.accounts.map(function(a){return chip('f-acc',a.id,esc(a.name),f.acc===a.id,a.color||0)}).join('')+'</div>'+
    '<div class="chips scroll">'+types.map(function(t){return chip('f-type',t[0],t[1],f.type===t[0])}).join('')+chip('f-all','x','همهٔ زمان‌ها',f.all)+'</div>'+
    (f.all?'':monthNav(f,'f-prev','f-next'))+
    '<div id="txlist" class="stack">'+txListHTML()+'</div></div>';
}
function viewRep(){
  var r=S.r,mk=r.jy*100+r.jm,e=0,inc=0,tin=0,tout=0,byCat={},byAcc={};
  S.tx.forEach(function(t){
    if(Math.floor(t.dk/100)!==mk)return;
    if(t.type==='transfer'){ if(r.acc!=='all'){ if(t.acc===r.acc)tout+=t.amount; if(t.to===r.acc)tin+=t.amount } return }
    if(r.acc!=='all'&&t.acc!==r.acc)return;
    if(t.type==='expense'){e+=t.amount; byCat[t.cat]=(byCat[t.cat]||0)+t.amount; byAcc[t.acc]=(byAcc[t.acc]||0)+t.amount}
    else inc+=t.amount;
  });
  var cats=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]});
  var bars=cats.map(function(c){var p=e?byCat[c]*100/e:0;return '<div class="bar"><div class="bar-h"><span>'+esc(CAT[c]||'متفرقه')+' <span class="muted">· '+pd(Math.round(p))+'٪</span></span><span class="amt">'+fmt(byCat[c])+'</span></div><div class="track"><div class="fill" style="width:'+p.toFixed(1)+'%"></div></div></div>'}).join('');
  var accs='';
  if(r.acc==='all'&&S.accounts.length>1){
    accs='<div class="sec"><span>خرج هر حساب در این ماه</span></div><div class="card">'+S.accounts.map(function(a){
      var v=byAcc[a.id]||0,p=e?v*100/e:0;
      return '<div class="bar"><div class="bar-h"><span><i class="dot" style="background:var(--a'+((a.color||0)%6)+')"></i> '+esc(a.name)+'</span><span class="amt">'+fmt(v)+'</span></div><div class="track"><div class="fill" style="width:'+p.toFixed(1)+'%;background:var(--a'+((a.color||0)%6)+')"></div></div></div>';
    }).join('')+'</div>';
  }
  var net=inc-e;
  return '<div class="stack"><div class="chips scroll">'+chip('r-acc','all','همه حساب‌ها',r.acc==='all')+S.accounts.map(function(a){return chip('r-acc',a.id,esc(a.name),r.acc===a.id,a.color||0)}).join('')+'</div>'+
    monthNav(r,'r-prev','r-next')+
    '<div class="tiles"><div class="tile"><small>جمع خرج</small><span class="amt expense">'+fmt(e)+'</span></div><div class="tile"><small>جمع درآمد</small><span class="amt income">'+fmt(inc)+'</span></div></div>'+
    '<div class="sum"><span>مانده ماه: <b class="'+(net<0?'neg':'')+'" dir="ltr">'+money(net)+'</b> تومان</span>'+(r.acc!=='all'?'<span>انتقال ورودی: '+fmt(tin)+'</span><span>انتقال خروجی: '+fmt(tout)+'</span>':'')+'</div>'+
    '<div class="sec"><span>خرج به تفکیک دسته</span></div>'+
    (bars?'<div class="card">'+bars+'</div>':'<div class="empty">در این ماه خرجی ثبت نشده.</div>')+accs+'</div>';
}
function viewAcc(){
  var bal=balances();
  var rows=S.accounts.map(function(a){
    var b=bal[a.id]||0;
    return '<button class="acc-row" data-act="edit-acc" data-id="'+esc(a.id)+'"><span class="l"><i class="dot" style="background:var(--a'+((a.color||0)%6)+')"></i><span>'+esc(a.name)+'</span></span><span class="amt'+(b<0?' neg':'')+'">'+money(b)+'</span></button>';
  }).join('');
  return '<div class="stack">'+(rows?'<div class="list">'+rows+'</div>':'')+
    (S.accounts.length?'':emptyAccounts())+
    '<button class="btn primary block" data-act="new-acc">+ حساب جدید</button>'+
    '<button class="btn block" data-act="open-bak">پشتیبان‌گیری و بازیابی</button><p class="muted" style="font-size:12.5px;margin:0">برای ویرایش یا حذف، روی هر حساب بزنید. مبالغ به تومان است. اطلاعات فقط روی همین گوشی ذخیره می‌شود؛ هر چند وقت یک بار پشتیبان بگیرید.</p></div>';
}
function render(){
  calcToday();
  $('#today').textContent='امروز '+pd(TODAY.d)+' '+MONTHS[TODAY.m-1]+' '+pd(TODAY.y);
  var sy=$('#sync'); sy.textContent='ذخیره روی این گوشی'; sy.className='sync'+(S.conf?' ok':'');
  $('#banner').innerHTML=S.err?'<div class="note warn">'+esc(S.err)+'</div>':((S.slow&&!S.conf)?'<div class="note warn">اتصال برقرار نشد. اطلاعات نمایش‌داده‌شده ممکن است قدیمی باشد.</div>':'');
  document.querySelectorAll('.nav [data-tab], .nav [data-act="tab"]').forEach(function(b){b.setAttribute('aria-current',b.dataset.v===S.tab?'page':'false')});
  $('#fab').setAttribute('aria-label',S.tab==='debts'?'بدهی جدید':'ثبت جدید');
  var v=$('#view');
  if(S.tab==='tx'&&document.activeElement&&document.activeElement.id==='q'&&$('#txlist')){$('#txlist').innerHTML=txListHTML();return}
  if(S.err&&!S.db){v.innerHTML='';return}
  if(!S.ready){v.innerHTML='<div class="empty">در حال بارگذاری…</div>';return}
  v.innerHTML=S.tab==='home'?viewHome():S.tab==='tx'?viewTx():S.tab==='rep'?viewRep():S.tab==='debts'?viewDebts():viewAcc();
  if(S.sheet&&S.sheet.kind==='dview')renderSheet();
}

/* ---------- sheets ---------- */
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2200)}
function closeSheet(){S.sheet=null;$('#sheet').innerHTML='';document.body.style.overflow=''}
function openSheet(d){S.sheet=d;document.body.style.overflow='hidden';renderSheet()}
function newTx(){
  if(!S.db){return}
  if(!S.accounts.length){toast('اول یک حساب بسازید');S.tab='acc';render();return}
  var la=lastAcc(); var acc=S.accMap[la]?la:S.accounts[0].id;
  openSheet({kind:'tx',id:null,type:'expense',amount:0,acc:acc,to:'',cat:'food',jy:TODAY.y,jm:TODAY.m,jd:TODAY.d,note:'',err:'',busy:false,del:false});
}
function editTx(id){
  var t=S.tx.filter(function(x){return x.id===id})[0]; if(!t)return;
  openSheet({kind:'tx',id:t.id,ts:t.ts,type:t.type,amount:t.amount,acc:t.acc,to:t.to||'',cat:t.cat||(t.type==='income'?'sale':'food'),jy:t.jy,jm:t.jm,jd:t.jd,note:t.note||'',err:'',busy:false,del:false});
}
function dayOptions(m,sel){var o='';for(var i=1;i<=maxDay(m);i++)o+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+pd(i)+'</option>';return o}
function renderSheet(){
  var d=S.sheet; if(!d){return}
  if(d.kind==='bak'){
    $('#sheet').innerHTML='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="پشتیبان"><div class="sh-head"><h2>پشتیبان‌گیری و بازیابی</h2><button class="x" data-act="close" aria-label="بستن">×</button></div><div class="sh-body">'+
      '<div class="fld"><span class="lbl">پشتیبان‌گیری</span><button class="btn block" data-act="bak-dl">دانلود فایل پشتیبان</button><button class="btn block" data-act="bak-copy">کپی متن پشتیبان</button></div>'+
      '<div class="fld"><span class="lbl">بازیابی</span><input id="b-file" type="file" accept=".json,.txt,application/json,text/plain" class="inp"><textarea id="b-text" class="inp" placeholder="یا متن پشتیبان را اینجا بچسبانید" style="min-height:110px;direction:ltr">'+esc(d.text)+'</textarea></div>'+
      (d.msg?'<div class="note">'+esc(d.msg)+'</div>':'')+(d.err?'<div class="err">'+esc(d.err)+'</div>':'')+'</div>'+
      '<div class="sh-foot">'+(d.confirm?'<div class="err">اطلاعات فعلی با این پشتیبان جایگزین می‌شود.</div><button class="btn dangerfill block" data-act="bak-restore">بله، بازیابی شود</button><button class="btn block" data-act="cancel-bak">انصراف</button>':'<button class="btn primary block" data-act="bak-restore">بازیابی از این متن</button>')+'</div></div>';
    return;
  }
  var html;
  if(d.kind==='dview'){
    var rr=debtCalc().filter(function(q){return q.d.id===d.id})[0];
    if(!rr){closeSheet();return}
    var dd=rr.d,pp=S.pays.filter(function(q){return q.debt===dd.id}).sort(function(a,b){return (b.dk-a.dk)||((b.ts||0)-(a.ts||0))});
