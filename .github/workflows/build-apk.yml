}

/* ---------- debts ---------- */
function debtCalc(){
  var paid={};S.pays.forEach(function(p){paid[p.debt]=(paid[p.debt]||0)+p.amount});
  return S.debts.map(function(d){var x=paid[d.id]||0;return {d:d,paid:x,rem:Math.max(0,d.amount-x)}});
}
function debtTotals(){
  var rows=debtCalc().filter(function(r){return r.rem>0}),t=0;
  rows.forEach(function(r){t+=r.rem});
  return {n:rows.length,total:t};
}
function debtLink(){
  var t=debtTotals();if(!t.n)return '';
  return '<div class="list"><button class="tx" data-act="tab" data-v="debts"><span class="tx-main"><span class="tx-title">بدهی‌ها</span><span class="tx-sub"><span>'+pd(t.n)+' نفر · باقی‌مانده (تومان)</span></span></span><span class="amt neg">'+fmt(t.total)+'</span></button></div>';
}
function debtCard(r){
  var d=r.d,p=d.amount?Math.min(100,r.paid*100/d.amount):0,late=r.rem>0&&d.due&&d.due<TODAY.k;
  return '<button class="debt" data-act="open-debt" data-id="'+esc(d.id)+'"><span class="debt-top"><span class="debt-name">'+esc(d.name)+'</span>'+(r.rem>0?'<span class="amt neg">'+fmt(r.rem)+'</span>':'<span class="badge">تسویه شد</span>')+'</span><span class="track"><span class="fill ok" style="width:'+p.toFixed(1)+'%"></span></span><span class="debt-sub">پرداخت‌شده '+fmt(r.paid)+' از '+fmt(d.amount)+' تومان'+(d.due&&r.rem>0?' · <span class="'+(late?'neg':'')+'">سررسید '+dayLabel(d.due)+'</span>':'')+'</span></button>';
}
function viewDebts(){
  var rows=debtCalc(),act=rows.filter(function(r){return r.rem>0}),done=rows.filter(function(r){return r.rem<=0});
  act.sort(function(a,b){var x=a.d.due||99999999,y=b.d.due||99999999;return (x-y)||((b.d.ts||0)-(a.d.ts||0))});
  done.sort(function(a,b){return (b.d.ts||0)-(a.d.ts||0)});
  var t=debtTotals();
  return '<div class="stack"><div class="tile"><small>جمع بدهی باقی‌مانده'+(t.n?' · '+pd(t.n)+' نفر':'')+'</small><span class="amt neg">'+fmt(t.total)+'</span><small style="text-align:end">تومان</small></div>'+
    (act.length?'<div class="stack">'+act.map(debtCard).join('')+'</div>':'<div class="empty">'+(done.length?'همهٔ بدهی‌ها تسویه شده است.':'هنوز بدهی‌ای ثبت نکرده‌اید. با دکمهٔ + نام شخص و مبلغ را اضافه کنید.')+'</div>')+
    (done.length?'<div class="sec"><span>تسویه‌شده‌ها</span></div><div class="stack">'+done.map(debtCard).join('')+'</div>':'')+
    '<button class="btn primary block" data-act="new-debt">+ بدهی جدید</button></div>';
}
function dateRow(p,y,m,d,fwd){
  var y0=Math.min(TODAY.y-3,y),y1=Math.max(TODAY.y+fwd,y),ys='';
  for(var i=y1;i>=y0;i--)ys+='<option value="'+i+'"'+(i===y?' selected':'')+'>'+pd(i)+'</option>';
  var ms=MONTHS.map(function(n,i){return '<option value="'+(i+1)+'"'+((i+1)===m?' selected':'')+'>'+n+'</option>'}).join('');
  return '<div class="row3"><select id="'+p+'-d" class="inp" aria-label="روز">'+dayOptions(m,d)+'</select><select id="'+p+'-m" class="inp" aria-label="ماه">'+ms+'</select><select id="'+p+'-y" class="inp" aria-label="سال">'+ys+'</select></div>';
}
