      (d.err?'<div class="err">'+esc(d.err)+'</div>':'')+'</div>'+
      '<div class="sh-foot"><button class="btn primary block" data-act="save-pay"'+(d.busy?' disabled':'')+'>'+(d.busy?'در حال ذخیره…':'ذخیره')+'</button>'+
