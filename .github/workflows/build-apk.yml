      '<div class="tiles"><div class="tile"><small>باقی‌مانده</small><span class="amt neg">'+fmt(rr.rem)+'</span></div><div class="tile"><small>پرداخت‌شده</small><span class="amt income">'+fmt(rr.paid)+'</span></div></div>'+
      '<span class="track"><span class="fill ok" style="width:'+prog.toFixed(1)+'%"></span></span>'+
      '<div class="sum"><span>مبلغ کل: <b>'+fmt(dd.amount)+'</b> تومان</span>'+(dd.dk?'<span>تاریخ: '+dayLabel(dd.dk)+'</span>':'')+(dd.due?'<span class="'+(late?'neg':'')+'">سررسید: '+dayLabel(dd.due)+'</span>':'')+'</div>'+
      (dd.note?'<div class="note">'+esc(dd.note)+'</div>':'')+
      '<div class="sec"><span>پرداخت‌ها</span></div>'+
