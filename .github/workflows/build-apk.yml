  if(d.kind==='tx'){
    var isT=d.type==='transfer', cats=d.type==='income'?INC:EXP;
    var accChips=function(act,sel){return '<div class="chips">'+S.accounts.map(function(a){return chip(act,a.id,esc(a.name),sel===a.id,a.color||0)}).join('')+'</div>'};
    var y0=Math.min(TODAY.y-3,d.jy),y1=Math.max(TODAY.y+1,d.jy),ys='';
    for(var y=y1;y>=y0;y--)ys+='<option value="'+y+'"'+(y===d.jy?' selected':'')+'>'+pd(y)+'</option>';
    var ms=MONTHS.map(function(n,i){return '<option value="'+(i+1)+'"'+((i+1)===d.jm?' selected':'')+'>'+n+'</option>'}).join('');
    html='<div class="sh-body">'+
      '<div class="seg">'+['expense','income','transfer'].map(function(t){return '<button data-act="set-type" data-v="'+t+'" aria-pressed="'+(d.type===t)+'">'+TYPES[t]+'</button>'}).join('')+'</div>'+
      '<label class="fld"><span>مبلغ (تومان)</span><input id="f-amount" class="inp big" inputmode="numeric" autocomplete="off" placeholder="۰" value="'+(d.amount?fmt(d.amount):'')+'"></label>'+
      '<div class="fld"><span class="lbl">'+(isT?'از حساب':'حساب')+'</span>'+accChips('pick-acc',d.acc)+'</div>'+
