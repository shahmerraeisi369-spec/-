      (d.id?(d.del?'<div class="err">این ثبت برای همیشه حذف می‌شود.</div><button class="btn dangerfill block" data-act="del-tx"'+(d.busy?' disabled':'')+'>بله، حذف شود</button><button class="btn block" data-act="cancel-del">انصراف</button>':'<button class="btn danger block" data-act="ask-del">حذف این ثبت</button>'):'')+'</div>';
    html='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="ثبت"><div class="sh-head"><h2>'+(d.id?'ویرایش ثبت':'ثبت جدید')+'</h2><button class="x" data-act="close" aria-label="بستن">×</button></div>'+html+'</div>';
  }else{
    var n=0; if(d.id){S.tx.forEach(function(t){if(t.acc===d.id||t.to===d.id)n++})}
    html='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="حساب"><div class="sh-head"><h2>'+(d.id?'ویرایش حساب':'حساب جدید')+'</h2><button class="x" data-act="close" aria-label="بستن">×</button></div>'+
      '<div class="sh-body"><label class="fld"><span>نام حساب</span><input id="a-name" class="inp" maxlength="40" autocomplete="off" placeholder="مثلاً: مغازه، خانواده" value="'+esc(d.name)+'"></label>'+
      '<label class="fld"><span>موجودی اولیه (تومان)</span><input id="a-init" class="inp" inputmode="numeric" autocomplete="off" placeholder="۰" value="'+(d.init?fmt(d.init):'')+'"></label>'+
      '<div class="fld"><span class="lbl">رنگ</span><div class="swatches">'+[0,1,2,3,4,5].map(function(i){return '<button class="sw" style="background:var(--a'+i+')" data-act="pick-color" data-v="'+i+'" aria-pressed="'+(d.color===i)+'" aria-label="رنگ '+pd(i+1)+'"></button>'}).join('')+'</div></div>'+
      (d.err?'<div class="err">'+esc(d.err)+'</div>':'')+'</div>'+
      '<div class="sh-foot"><button class="btn primary block" data-act="save-acc"'+(d.busy?' disabled':'')+'>'+(d.busy?'در حال ذخیره…':'ذخیره')+'</button>'+
      (d.id?(d.del?'<div class="err">این حساب'+(n?' و '+pd(n)+' ثبت مربوط به آن':'')+' برای همیشه حذف می‌شود.</div><button class="btn dangerfill block" data-act="del-acc"'+(d.busy?' disabled':'')+'>بله، حذف شود</button><button class="btn block" data-act="cancel-del">انصراف</button>':'<button class="btn danger block" data-act="ask-del">حذف حساب</button>'):'')+'</div></div>';
  }
  $('#sheet').innerHTML=html;
}
function newAcc(){openSheet({kind:'acc',id:null,name:'',init:0,color:S.accounts.length%6,err:'',busy:false,del:false})}
function editAcc(id){var a=S.accMap[id];if(!a)return;openSheet({kind:'acc',id:a.id,ts:a.ts,name:a.name,init:a.init||0,color:(a.color||0)%6,err:'',busy:false,del:false})}

var SAVE_ERR='ذخیره نشد. اینترنت را بررسی کنید و دوباره امتحان کنید.';
async function saveTx(){
  var d=S.sheet; if(!d||d.busy)return;
  if(!(d.amount>0)){d.err='مبلغ را وارد کنید.';renderSheet();return}
  if(!S.accMap[d.acc]){d.err='حساب را انتخاب کنید.';renderSheet();return}
  if(d.type==='transfer'&&(!S.accMap[d.to]||d.to===d.acc)){d.err='حساب مقصد را انتخاب کنید (باید با حساب مبدأ فرق داشته باشد).';renderSheet();return}
  var jd=Math.min(d.jd,maxDay(d.jm));
  var o={type:d.type,amount:d.amount,acc:d.acc,jy:d.jy,jm:d.jm,jd:jd,dk:dk(d.jy,d.jm,jd),note:(d.note||'').trim().slice(0,300),ts:d.ts||Date.now()};
  if(d.type==='transfer')o.to=d.to; else o.cat=d.cat;
  d.busy=true;d.err='';renderSheet();
  try{
    if(d.id)await S.db.doc('tx/'+d.id).set(o); else await S.db.collection('tx').add(o);
    saveLast(d.acc);closeSheet();toast('ثبت شد');
  }catch(e){d.busy=false;d.err=SAVE_ERR;renderSheet()}
}
async function delTx(){
  var d=S.sheet; if(!d||!d.id||d.busy)return; d.busy=true;renderSheet();
  try{await S.db.doc('tx/'+d.id).delete();closeSheet();toast('حذف شد')}catch(e){d.busy=false;d.err=SAVE_ERR;renderSheet()}
}
async function saveAcc(){
  var d=S.sheet; if(!d||d.busy)return;
  var name=(d.name||'').trim();
  if(!name){d.err='نام حساب را بنویسید.';renderSheet();return}
  d.busy=true;d.err='';renderSheet();
  try{
    if(d.id)await S.db.doc('accounts/'+d.id).update({name:name,init:d.init||0,color:d.color});
    else await S.db.collection('accounts').add({name:name,init:d.init||0,color:d.color,ts:Date.now()});
    closeSheet();toast('ذخیره شد');
  }catch(e){d.busy=false;d.err=SAVE_ERR;renderSheet()}
}
async function delAcc(){
  var d=S.sheet; if(!d||!d.id||d.busy)return; d.busy=true;renderSheet();
  try{
    var ids=S.tx.filter(function(t){return t.acc===d.id||t.to===d.id}).map(function(t){return t.id});
    for(var i=0;i<ids.length;i++)await S.db.doc('tx/'+ids[i]).delete();
    await S.db.doc('accounts/'+d.id).delete();
    if(S.f.acc===d.id)S.f.acc='all'; if(S.r.acc===d.id)S.r.acc='all';
    closeSheet();toast('حذف شد');
  }catch(e){d.busy=false;d.err=SAVE_ERR;renderSheet()}
}
